name: Geolandar - Mise à jour élections

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests supabase pycountry

      - name: Lancer la mise à jour
        run: python update_elections.py
        
      - name: Lancer la mise à jour des dirigeants
        run: python update_dirigeants.py

      - name: Lancer la mise à jour des régions et des chambres
        run: python update_regions.py

      - name: Repérer les dirigeants désignés (pas encore en fonction)
        run: python update_designations.py

      - name: Rapport « à mettre à jour à la main » et alertes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rapport_manuel.py

      - name: Enregistrer le rapport
        if: always()
        run: |
          git config user.name "geolandar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/a_mettre_a_jour.json
          if git diff --cached --quiet; then echo "Rapport inchangé"; else git commit -m "Rapport : à mettre à jour à la main" && git pull --rebase && git push; fi
